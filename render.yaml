# Render Blueprint: creates the ML service and the API server in one go.
# Render dashboard -> New -> Blueprint -> pick this repo. Values marked sync:false are asked for once.
# Full guide: docs/DEPLOYMENT.md
services:
  # ---------------- Python ML service (FastAPI) ----------------
  - type: web
    name: agri-dss-ml
    runtime: python
    plan: free
    region: singapore
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt "scikit-learn==1.7.2" "numpy==2.1.3" && python scripts/fetch_artifacts.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: INTERNAL_API_KEY
        sync: false            # same value as ML_INTERNAL_KEY on agri-dss-api
      - key: ARTIFACTS_URL
        sync: false            # link to agri-dss-artifacts.zip
      - key: ARTIFACTS_TOKEN
        sync: false            # only for a private GitHub repo; leave empty otherwise
      - key: CORS_ORIGINS
        sync: false            # https://agri-dss-api.onrender.com
      - key: DISEASE_CONFIDENCE_THRESHOLD
        value: "0.5"

  # ---------------- Node.js API server (Express) ----------------
  - type: web
    name: agri-dss-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false            # https://<your-app>.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ML_SERVICE_URL
        sync: false            # https://agri-dss-ml.onrender.com
      - key: ML_INTERNAL_KEY
        sync: false            # same value as INTERNAL_API_KEY on agri-dss-ml
      - key: ML_TIMEOUT_MS
        value: "60000"         # free services sleep; the first call after a nap is slow
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_THINKING_LEVEL
        value: minimal
      - key: PLACES_USER_AGENT
        value: agri-dss/0.1 (B.Tech student project)
